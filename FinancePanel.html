<dialog id="finEditor" class="fin-dialog" aria-labelledby="finEditorTitle" dir="rtl">
 <div class="fin-head"><div><h2 id="finEditorTitle"></h2><span id="finEditorState" class="fin-badge"></span></div><button class="btn dark" id="finClose" type="button">إغلاق</button></div>
 <p id="finEditorNotice" class="fin-notice" role="status" aria-live="polite"></p>
 <form id="finRecordForm"><div id="finFields" class="fin-grid"></div><div id="finPreview" class="fin-preview" aria-live="polite"></div><label id="finEditReasonBox" hidden>سبب التعديل<textarea id="finEditReason" maxlength="500" rows="2"></textarea></label><div class="fin-actions" style="margin-top:16px"><button class="btn gold" id="finSave" type="submit">حفظ السجل</button><button class="btn dark" id="finCancelRecord" type="button" hidden>إلغاء السجل</button></div></form>

</dialog>

<script>
window.AdminFinance=(()=>{
 const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const money=n=>new Intl.NumberFormat('ar-JO',{minimumFractionDigits:2,maximumFractionDigits:3}).format((Number(n)||0)/1000)+' د.أ',plain=n=>String((Number(n)||0)/1000),stamp=v=>new Intl.DateTimeFormat('ar-JO',{timeZone:'Asia/Amman',dateStyle:'medium',timeStyle:'short'}).format(new Date(v));
 const nowDate=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Amman',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
 let epoch=0,working=false,current=null,currentKind='',pending=null,action=null,editorSeq=0;
 const state={payroll:{offset:0,seq:0,data:null},expense:{offset:0,seq:0,data:null}},main=document.querySelector('main.wrap'),nav=document.querySelector('.tabs [data-org-group="manager"] .org-group-buttons');
 const definitions={payroll:{view:'payrollView',title:'شؤون الموظفين',add:'إضافة راتب',description:'الرواتب الشهرية، الإضافات، الخصومات والسلف، والدفعات المسجلة.',path:'M8 10a4 4 0 1 0 0-8 4 4 0 0 0 0 8M2 22v-4a6 6 0 0 1 10-4M14 13h8v8h-8zM18 15v4M16 17h4'},expense:{view:'expensesView',title:'المصروفات والفواتير',add:'إضافة مصروف / فاتورة',description:'متابعة مصروفات العمل والفواتير والمبالغ المسددة والمتبقية.',path:'M5 2h14v20l-3-2-4 2-4-2-3 2V2M8 7h8M8 11h8M8 15h4'}};
 Object.entries(definitions).forEach(([kind,d])=>{
  const b=document.createElement('button');b.className='btn tabBtn';b.type='button';b.dataset.view=d.view;b.hidden=true;b.innerHTML='<svg class="wf-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="'+d.path+'"/></svg><span>'+d.title+'</span>';b.onclick=()=>showView(d.view);nav.append(b);
  const section=document.createElement('section');section.id=d.view;section.className='view fin-view';section.innerHTML='<div class="card"><div class="fin-head"><div><span class="fin-badge">للمدير فقط</span><h2>'+d.title+'</h2><p class="fin-sub">'+d.description+'</p></div><button class="btn gold" id="fin-'+kind+'-add">＋ '+d.add+'</button></div><div class="fin-tools"><label>الشهر<input id="fin-'+kind+'-month" type="month" required value="'+nowDate().slice(0,7)+'"></label><label>الحالة<select id="fin-'+kind+'-status"><option value="">جميع الحالات</option><option>غير مسدد</option><option>مسدد جزئيًا</option><option>مسدد</option><option>ملغي</option></select></label><label>بحث<input id="fin-'+kind+'-query" type="search" maxlength="120" placeholder="'+(kind==='payroll'?'اسم الموظف':'البيان، الجهة أو رقم الفاتورة')+'"></label><button class="btn dark" id="fin-'+kind+'-refresh">تحديث</button><button class="btn dark" id="fin-'+kind+'-export">تصدير القائمة CSV</button></div><p id="fin-'+kind+'-notice" class="fin-notice" role="status" aria-live="polite"></p><div id="fin-'+kind+'-stats" class="fin-stats"></div><p id="fin-'+kind+'-summary" class="fin-sub"></p><div id="fin-'+kind+'-rows" class="fin-list"></div><div class="fin-page"><button class="btn dark" id="fin-'+kind+'-prev" hidden>السابق</button><span id="fin-'+kind+'-count"></span><button class="btn dark" id="fin-'+kind+'-next" hidden>التالي</button></div></div>';main.append(section);
  $('fin-'+kind+'-add').onclick=()=>openNew(kind);$('fin-'+kind+'-refresh').onclick=()=>reload(kind,true);$('fin-'+kind+'-export').onclick=()=>exportCsv(kind);['month','status'].forEach(key=>$('fin-'+kind+'-'+key).onchange=()=>reload(kind,true));$('fin-'+kind+'-query').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();reload(kind,true);}};$('fin-'+kind+'-query').onsearch=()=>reload(kind,true);$('fin-'+kind+'-prev').onclick=()=>{state[kind].offset=Math.max(0,state[kind].offset-50);reload(kind);};$('fin-'+kind+'-next').onclick=()=>{state[kind].offset+=50;reload(kind);};$('fin-'+kind+'-rows').onclick=e=>{const button=e.target.closest('[data-fin-id]');if(button)openRecord(kind,button.dataset.finId);};
 });
 function notice(id,text,error=false){$(id).textContent=text;$(id).dataset.error=String(error);}
 async function rpc(name,args=[]){const e=epoch,result=await AdminPortal.rpc(name,args);if(e!==epoch||!AdminPortal.isNative())throw Error('انتهت الجلسة.');return result;}
 function params(kind){return {kind,month:$('fin-'+kind+'-month').value,status:$('fin-'+kind+'-status').value,query:$('fin-'+kind+'-query').value.trim(),offset:state[kind].offset};}
 async function reload(kind,first=false){if(!AdminPortal.isNative())return;if(first)state[kind].offset=0;const seq=++state[kind].seq,e=epoch;notice('fin-'+kind+'-notice','جارٍ تحميل السجلات...');try{const data=await rpc('adminFinanceList',[params(kind)]);if(seq!==state[kind].seq)return;state[kind].data=data;render(kind,data);notice('fin-'+kind+'-notice','');}catch(err){if(e===epoch&&seq===state[kind].seq)notice('fin-'+kind+'-notice',err.message,true);}}
 function render(kind,d){const s=d.summary,stats=[[kind==='payroll'?'صافي رواتب الشهر':'قيمة مصروفات وفواتير الشهر',s.total],['المسدد لهذه السجلات',s.paid],['المتبقي لهذه السجلات',s.balance],['دفعات تمت خلال الشهر',s.cashPaid]];$('fin-'+kind+'-stats').innerHTML=stats.map(([label,n])=>'<div class="fin-stat"><span>'+label+'</span><strong>'+money(n)+'</strong></div>').join('');$('fin-'+kind+'-summary').textContent='ملخص الشهر كاملًا، دون السجلات الملغاة · '+s.count+' سجل'+(kind==='payroll'?' · خصومات: '+money(s.deductions)+' · سلف محتسبة: '+money(s.advances):' · فواتير متأخرة السداد: '+s.overdue)+'. دفعات الشهر تشمل الدفع لسجلات الأشهر الأخرى.';
  $('fin-'+kind+'-rows').innerHTML=d.rows.length?d.rows.map(r=>'<article class="fin-record" data-state="'+esc(r.status)+'"><div class="fin-head"><div><h3>'+esc(kind==='payroll'?r.employee:r.title)+'</h3><span class="fin-sub">'+esc(kind==='payroll'?r.month:r.type+' · '+r.category+' · '+r.payee)+'</span></div><span class="fin-badge">'+esc(r.status)+'</span></div><div class="fin-meta"><span>'+(kind==='payroll'?'صافي المستحق':'القيمة')+': <strong>'+money(r.total)+'</strong></span><span>المدفوع: '+money(r.paid)+'</span><span>المتبقي: <strong>'+money(r.balance)+'</strong></span></div><div class="fin-actions" style="margin-top:14px"><span class="fin-sub">'+(kind==='payroll'?'أساسي '+money(r.base)+' · إضافات '+money(r.allowance)+' · خصومات '+money(r.deduction)+' · سلف '+money(r.advance):esc(r.invoiceNumber?'فاتورة #'+r.invoiceNumber:r.date)+(r.dueDate?' · الاستحقاق '+esc(r.dueDate):''))+'</span><button class="btn dark" data-fin-id="'+esc(r.id)+'">فتح التفاصيل والدفعات</button></div></article>').join(''):'<div class="fin-empty"><strong>لا توجد سجلات مطابقة</strong>'+(kind==='payroll'?'أضف راتب موظف لهذا الشهر أو غيّر البحث.':'أضف أول مصروف أو فاتورة، أو غيّر البحث.')+'</div>';
  const offset=state[kind].offset;$('fin-'+kind+'-count').textContent=d.total?'عرض '+(offset+1)+'–'+Math.min(offset+50,d.total)+' من '+d.total:'';$('fin-'+kind+'-prev').hidden=offset===0;$('fin-'+kind+'-next').hidden=offset+50>=d.total;
 }
 function input(id,label,value='',extra=''){return '<label>'+label+'<input id="'+id+'" value="'+esc(value)+'" '+extra+'></label>';}
 function opts(values,selected,empty=false){return(empty?'<option value="">اختر الموظف</option>':'')+values.map(v=>'<option'+(v===selected?' selected':'')+'>'+esc(v)+'</option>').join('');}
 function showEditor(kind,record){currentKind=kind;current=record;pending=null;const d=state[kind].data,r=record||{},exists=!!r.version,amountAttrs='inputmode="decimal" required maxlength="14" autocomplete="off"';$('finEditorTitle').textContent=exists?(kind==='payroll'?'راتب '+r.employee+' — '+r.month:r.title):definitions[kind].add;$('finEditorState').textContent=exists?r.status:'سجل جديد';notice('finEditorNotice','');
  $('finFields').innerHTML=kind==='payroll'?'<label>الموظف<select id="finEmployee" required '+(exists?'disabled':'')+'>'+opts(d.employees,r.employee,true)+'</select></label>'+input('finMonth','شهر الراتب',r.month||d.month,'type="month" required '+(exists?'disabled':''))+input('finBase','الراتب الأساسي (د.أ)',plain(r.base),amountAttrs)+input('finAllowance','الإضافات / المكافآت (د.أ)',plain(r.allowance),amountAttrs)+input('finDeduction','الخصومات (د.أ)',plain(r.deduction),amountAttrs)+input('finAdvance','السلف السابقة المحتسبة (د.أ)',plain(r.advance),amountAttrs)+input('finDeductionReason','سبب الخصم',r.deductionReason||'','maxlength="500"')+input('finAdvanceReason','بيان السلف المحتسبة',r.advanceReason||'','maxlength="500"')+'<p class="fin-sub fin-wide">صافي المستحق = الأساسي + الإضافات − الخصومات − السلف السابقة. السلف هنا تخصم من الراتب ولا تسجل كدفعة جديدة.</p>':input('finDate','تاريخ المصروف / الفاتورة',r.date||(d.month===d.today.slice(0,7)?d.today:d.month+'-01'),'type="date" required')+'<label>نوع السجل<select id="finType">'+opts(['مصروف','فاتورة'],r.type||'مصروف')+'</select></label>'+input('finTitle','بيان المصروف / الفاتورة',r.title||'','required maxlength="180"')+'<label>التصنيف<select id="finCategory">'+opts(d.categories,r.category||'أخرى')+'</select></label>'+input('finPayee','الجهة / المورد',r.payee||'','required maxlength="150"')+input('finInvoiceNumber','رقم الفاتورة (اختياري)',r.invoiceNumber||'','maxlength="100"')+input('finAmount','القيمة الإجمالية (د.أ)',plain(r.amount),amountAttrs)+input('finDueDate','تاريخ الاستحقاق (اختياري)',r.dueDate||'','type="date"')+input('finInvoiceUrl','رابط الفاتورة في Google Drive (اختياري)',r.invoiceUrl||'','type="url" maxlength="1000" placeholder="https://drive.google.com/…"');
  $('finFields').insertAdjacentHTML('beforeend','<label class="fin-wide">ملاحظات (اختياري)<textarea id="finNotes" maxlength="1000" rows="2">'+esc(r.notes||'')+'</textarea></label>');$('finEditReasonBox').hidden=!exists;$('finEditReason').value='';$('finEditReason').required=exists;$('finRecordForm').hidden=!!r.cancelled;$('finRestoreRecord').hidden=!r.cancelled;$('finCancelRecord').hidden=!exists||!!r.cancelled;$('finCancelRecord').disabled=(r.paid||0)>0;$('finCancelRecord').title=(r.paid||0)>0?'يلزم إلغاء الدفعات المسجلة قبل إلغاء السجل':'';$('finPaymentsSection').hidden=!exists;
  if(exists){$('finBalance').textContent='المدفوع: '+money(r.paid)+' · المتبقي: '+money(r.balance);$('finPayments').innerHTML=(r.payments||[]).map(p=>'<div class="fin-entry" data-void="'+!!p.voidedAt+'"><div class="fin-head"><strong>'+money(p.amount)+' · '+esc(p.method)+'</strong><span>'+esc(p.date)+(p.voidedAt?' · دفعة ملغاة':'')+'</span></div><p class="fin-sub">'+esc([p.reference,p.notes].filter(Boolean).join(' · '))+'</p>'+(p.voidedAt?'<p>سبب الإلغاء: '+esc(p.voidReason)+'</p>':'<button class="btn dark" type="button" data-void-payment="'+esc(p.id)+'">تصحيح بإلغاء الدفعة</button>')+'</div>').join('')||'<p class="fin-sub">لم تسجل دفعات بعد.</p>';$('finPayDetails').hidden=r.cancelled||r.balance<=0;$('finPayDetails').open=false;$('finPaymentForm').reset();$('finPayAmount').value=plain(r.balance);$('finPayDate').value=d.today;$('finPayDate').max=d.today;$('finPayMethod').innerHTML=opts(d.methods,'نقدًا');const actionLabels={save:'حفظ السجل',pay:'تسجيل دفعة',void:'إلغاء دفعة',cancel:'إلغاء السجل',restore:'استعادة السجل'};$('finHistory').innerHTML=(r.history||[]).slice().reverse().map(h=>'<li><strong>'+actionLabels[h.action]+'</strong> · '+esc(stamp(h.at))+(h.reason?'<br>'+esc(h.reason):'')+'</li>').join('');if(kind==='expense'&&r.invoiceUrl){const a=document.createElement('a');a.className='btn dark';a.href=r.invoiceUrl;a.target='_blank';a.rel='noopener noreferrer';a.textContent='فتح الفاتورة';$('finBalance').append(document.createTextNode(' '),a);}}
  updatePreview();if(!$('finEditor').open)$('finEditor').showModal();
 }
 function numberValue(id){return Number($(id)?.value.replace(/[٠-٩]/g,c=>String('٠١٢٣٤٥٦٧٨٩'.indexOf(c))).replace(/٫/g,'.'))||0;}
 function updatePreview(){const kind=currentKind;if(!kind)return;const amount=kind==='payroll'?numberValue('finBase')+numberValue('finAllowance')-numberValue('finDeduction')-numberValue('finAdvance'):numberValue('finAmount');$('finPreview').textContent=(kind==='payroll'?'صافي المستحق: ':'إجمالي القيمة: ')+money(Math.round(amount*1000));if(kind==='payroll'){$('finDeductionReason').required=numberValue('finDeduction')>0;$('finAdvanceReason').required=numberValue('finAdvance')>0;}}
 function recordData(){const value=id=>$(id).value.trim();return currentKind==='payroll'?{employee:value('finEmployee'),month:value('finMonth'),base:value('finBase'),allowance:value('finAllowance'),deduction:value('finDeduction'),advance:value('finAdvance'),deductionReason:value('finDeductionReason'),advanceReason:value('finAdvanceReason'),notes:value('finNotes')}:{date:value('finDate'),type:value('finType'),category:value('finCategory'),title:value('finTitle'),payee:value('finPayee'),invoiceNumber:value('finInvoiceNumber'),amount:value('finAmount'),dueDate:value('finDueDate'),invoiceUrl:value('finInvoiceUrl'),notes:value('finNotes')};}
 async function openNew(kind){if(working||!AdminPortal.isNative())return;const e=epoch;if(!state[kind].data)await reload(kind);if(e!==epoch||!state[kind].data)return;showEditor(kind,{id:'fin_'+crypto.randomUUID()});}
 async function openRecord(kind,id){if(working||!AdminPortal.isNative())return;const seq=++editorSeq,e=epoch;notice('fin-'+kind+'-notice','جارٍ فتح السجل...');try{const data=await rpc('adminFinanceGet',[kind,id]);if(seq!==editorSeq)return;showEditor(kind,data);notice('fin-'+kind+'-notice','');}catch(err){if(e===epoch)notice('fin-'+kind+'-notice',err.message,true);}}
 function setBusy(b){working=b;document.querySelectorAll('#finEditor button,#finActionDialog button,#finEditor input,#finEditor textarea,#finEditor select,#finActionDialog textarea').forEach(el=>el.disabled=b);if(!b&&current?.version){if($('finEmployee'))$('finEmployee').disabled=true;if($('finMonth'))$('finMonth').disabled=true;$('finCancelRecord').disabled=current.paid>0;}}
 async function mutate(actionName,data,reason='',close=false){if(working||!current||!AdminPortal.isNative())return;const kind=currentKind,e=epoch,body={kind,id:current.id,version:current.version||'',action:actionName,data,reason},serialized=JSON.stringify(body),target=$('finActionDialog').open?'finActionNotice':'finEditorNotice';if(!pending||pending.serialized!==serialized)pending={serialized,opId:'op_'+crypto.randomUUID()};setBusy(true);notice(target,'جارٍ الحفظ...');try{const result=await rpc('adminFinanceSave',[{...body,opId:pending.opId}]);pending=null;$('finActionDialog').close();if(close){$('finEditor').close();current=null;$('fin-'+kind+'-month').value=kind==='payroll'?result.month:result.date.slice(0,7);state[kind].offset=0;}else showEditor(kind,result);await reload(kind);if(close)notice('fin-'+kind+'-notice','تم حفظ السجل.');else notice('finEditorNotice','تم حفظ الإجراء.');}catch(err){if(e===epoch)notice(target,err.message,true);}finally{if(e===epoch)setBusy(false);}}
 function requestAction(type,paymentId){if(working||!current)return;action={type,paymentId};$('finActionTitle').textContent=type==='void'?'إلغاء دفعة مسجلة':type==='cancel'?'إلغاء السجل':'استعادة السجل';$('finActionText').textContent=type==='void'?'يعود المبلغ إلى المتبقي مع الاحتفاظ بتاريخ الدفعة وسبب الإلغاء.':type==='cancel'?'سيبقى السجل محفوظًا ويمكن استعادته، ويستبعد من ملخص الشهر.':'سيعود السجل إلى الحسابات الشهرية.';$('finActionReason').value='';notice('finActionNotice','');$('finActionDialog').showModal();}
 $('finFields').oninput=updatePreview;$('finRecordForm').onsubmit=e=>{e.preventDefault();mutate('save',recordData(),$('finEditReason').value.trim(),true);};$('finPaymentForm').onsubmit=e=>{e.preventDefault();mutate('pay',{amount:$('finPayAmount').value,date:$('finPayDate').value,method:$('finPayMethod').value,reference:$('finPayReference').value,notes:$('finPayNotes').value});};$('finActionForm').onsubmit=e=>{e.preventDefault();mutate(action.type,{paymentId:action.paymentId||''},$('finActionReason').value.trim());};$('finCancelRecord').onclick=()=>requestAction('cancel');$('finRestoreRecord').onclick=()=>requestAction('restore');$('finPayments').onclick=e=>{const b=e.target.closest('[data-void-payment]');if(b)requestAction('void',b.dataset.voidPayment);};$('finClose').onclick=()=>{if(!working){editorSeq++;$('finEditor').close();current=null;}};$('finActionClose').onclick=()=>{if(!working)$('finActionDialog').close();};['finEditor','finActionDialog'].forEach(id=>$(id).addEventListener('cancel',e=>{if(working)e.preventDefault();}));
 async function exportCsv(kind){if(working||!AdminPortal.isNative())return;const e=epoch,filter=params(kind),button=$('fin-'+kind+'-export');button.disabled=true;notice('fin-'+kind+'-notice','تجهيز ملف Excel بصيغة CSV...');try{const rows=[];let offset=0,total=1;while(offset<total){const page=await rpc('adminFinanceList',[{...filter,offset}]);total=page.total;rows.push(...page.rows);if(!page.rows.length)break;offset+=page.rows.length;}if(!rows.length)throw Error('لا توجد سجلات لتصديرها.');const table=kind==='payroll'?[['الشهر','الموظف','الأساسي','الإضافات','الخصومات','السلف المحتسبة','الصافي','المدفوع','المتبقي','الحالة','سبب الخصم','بيان السلف'],...rows.map(r=>[r.month,r.employee,...['base','allowance','deduction','advance','total','paid','balance'].map(k=>plain(r[k])),r.status,r.deductionReason,r.advanceReason])]:[['التاريخ','النوع','التصنيف','البيان','الجهة','رقم الفاتورة','القيمة','المدفوع','المتبقي','الحالة','الاستحقاق','رابط الفاتورة'],...rows.map(r=>[r.date,r.type,r.category,r.title,r.payee,r.invoiceNumber,plain(r.total),plain(r.paid),plain(r.balance),r.status,r.dueDate,r.invoiceUrl])];const cell=v=>{let s=String(v??'');if(/^[\s]*[=+@-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';},blob=new Blob(['\uFEFF'+table.map(r=>r.map(cell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=definitions[kind].title+'_'+filter.month+'.csv';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);notice('fin-'+kind+'-notice','تم تصدير '+rows.length+' سجل.');}catch(err){if(e===epoch)notice('fin-'+kind+'-notice',err.message,true);}finally{if(e===epoch)button.disabled=false;}}
 function reset(){epoch++;editorSeq++;working=false;current=null;currentKind='';pending=null;action=null;Object.keys(state).forEach(kind=>{state[kind].seq++;state[kind].data=null;state[kind].offset=0;['rows','stats','summary','notice','count'].forEach(key=>$('fin-'+kind+'-'+key).replaceChildren());$('fin-'+kind+'-query').value='';$('fin-'+kind+'-status').value='';$('fin-'+kind+'-export').disabled=false;});['finFields','finPayments','finHistory','finBalance','finPreview','finEditorTitle','finEditorState','finEditorNotice','finActionNotice'].forEach(id=>$(id).replaceChildren());$('finEditReason').value='';$('finActionReason').value='';$('finPaymentForm').reset();$('finEditor').close();$('finActionDialog').close();setBusy(false);}
 function sessionChanged(){const allowed=AdminPortal.isNative();Object.values(definitions).forEach(d=>document.querySelector('.tabs [data-view="'+d.view+'"]').hidden=!allowed);}
 return {reset,sessionChanged,onView:id=>{const kind=Object.keys(definitions).find(k=>definitions[k].view===id);if(kind&&AdminPortal.isNative())reload(kind);}};
})();
</script>

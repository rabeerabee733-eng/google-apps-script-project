</style>
<script>
(()=>{'use strict';if(document.getElementById('thPhoneBrand'))return;const $=s=>document.querySelector(s);const paths={box:'M3 7l9-4 9 4-9 4-9-4zm0 0v10l9 4 9-4V7M12 11v10',edit:'M15 4l5 5M4 20l4-1L20 7a3 3 0 0 0-4-4L4 15v5z',chat:'M21 11a9 9 0 0 1-9 9H5l-4 2 2-6a9 9 0 1 1 18-5z',phone:'M6 3h3l2 5-3 2a15 15 0 0 0 6 6l2-3 5 2v3a3 3 0 0 1-3 3A18 18 0 0 1 3 6a3 3 0 0 1 3-3z'};const icon=k=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+paths[k]+'"/></svg>';const brand=document.createElement('div');brand.id='thPhoneBrand';brand.className='th-phone-brand';brand.innerHTML=icon('box')+'<span>تحضير · Tahdir</span>';$('.brand')?.prepend(brand);[['#newBtn','إضافة طلب جديد'],['#refreshAllBtn','تحديث البيانات']].forEach(([s,t])=>{const b=$(s);if(b){b.setAttribute('aria-label',t);b.title=t}});
function cards(){document.querySelectorAll('#results .result').forEach(card=>{if(card.dataset.thPhone)return;card.dataset.thPhone='1';[['.openOrder','edit'],['.waOrder','chat']].forEach(([s,k])=>{const b=card.querySelector(s);if(b)b.insertAdjacentHTML('afterbegin',icon(k))});const text=card.querySelector('.ux-customer>.muted')?.textContent||'';const phone=text.replace(/[^+0-9]/g,'');const actions=card.querySelector('.rowActions');if(actions&&/^\+?\d{8,15}$/.test(phone)){const a=document.createElement('a');a.className='btn dark th-phone-only';a.href='tel:'+phone;a.setAttribute('aria-label','اتصال بالزبون');a.innerHTML=icon('phone')+'<span>اتصال</span>';actions.append(a)}})}const results=$('#results');if(results){new MutationObserver(cards).observe(results,{childList:true});cards()}
const offline=document.createElement('div');offline.className='th-offline th-phone-only';offline.setAttribute('role','status');offline.textContent='انقطع الإنترنت. البيانات الظاهرة قديمة؛ أعد الاتصال ثم حدّث قبل متابعة العمل.';$('.top')?.after(offline);function connection(){offline.hidden=navigator.onLine}addEventListener('online',connection);addEventListener('offline',connection);connection();
})();
</script>

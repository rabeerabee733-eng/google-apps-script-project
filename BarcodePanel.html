<style>
#barcodePanel .barcode-modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:15px 0}#barcodePanel .barcode-modes button{padding:20px;font-size:19px;border:1px solid #66542b;border-radius:12px;background:#26221a;color:#fff}#barcodePanel .barcode-modes button[aria-pressed=true]{background:#d4af37;color:#171717;font-weight:bold}#barcodePanel .barcode-info{white-space:pre-wrap;line-height:1.9;background:#242424;padding:16px;border-radius:12px}#barcodePanel .barcode-table{max-width:100%;overflow:auto}#barcodePanel .barcode-table table{min-width:850px;width:100%}#barcodePanel video{width:100%;max-height:320px;background:#000}#barcodePanel label{display:block;line-height:1.8}#barcodePanel .barcode-summary{display:flex;gap:18px;flex-wrap:wrap;padding:14px;background:#1e3a5f;border-radius:10px}#barcodePanel [hidden]{display:none!important}#barcodePanel input[type=file]{max-width:260px}#barcodePanel .barcode-section{border-top:1px solid #555;margin-top:24px;padding-top:16px}#barcodePanel td{vertical-align:top}#barcodePanel .barcode-actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}@media(max-width:650px){#barcodePanel .barcode-modes{grid-template-columns:1fr}#barcodePanel .barcode-actions .btn{flex:1}}
</style>
<section id="barcodePanel" hidden>
<div class="barcode-modes"><button id="barcode-mode-handover" aria-pressed="false">تسليم للمندوب</button><button id="barcode-mode-inquiry" aria-pressed="true">استعلام عن الطلب</button></div>
<p id="barcode-notice" class="ops-status" role="status" aria-live="polite"></p>
<button id="barcode-setup" class="btn dark" hidden>تهيئة أعمدة التسليم في كشف Drive</button>
<div id="barcode-company-box" class="ops-grid" hidden><label>شركة التوصيل<select id="barcode-company"><option value="">اختر الشركة</option><option value="__new">إضافة اسم شركة</option></select></label><label id="barcode-company-new-box" hidden>اسم شركة التوصيل<input id="barcode-company-new" maxlength="100" placeholder="اكتب اسم الشركة"></label></div>
<div class="ops-grid"><label>طريقة البحث<select id="barcode-kind"><option value="barcode">رقم الباركود</option><option value="order">رقم الطلب</option></select></label><label>الرقم<input id="barcode-value" inputmode="numeric" autocomplete="off" placeholder="امسح الباركود أو أدخل الرقم"></label></div>
<div class="barcode-actions"><button id="barcode-read" class="btn gold">عرض معلومات الطلب</button><button id="barcode-camera" class="btn dark">📷 قراءة بالكاميرا</button><label class="btn dark">قراءة صورة الباركود<input id="barcode-image" type="file" accept="image/*" capture="environment"></label></div>
<div id="barcode-camera-box" hidden><video id="barcode-video" autoplay muted playsinline></video><button id="barcode-stop" class="btn dark">إيقاف الكاميرا</button></div>
<div id="barcode-inquiry" class="barcode-info" hidden></div>
<section id="barcode-cart-box" hidden><h3>طلبات دفعة التسليم</h3><p>اقرأ باركود كل طلب لإضافته، ثم راجع القائمة وأكد تسليمها للشركة. لا يُسجّل التسليم بمجرد المسح.</p><div id="barcode-cart" class="barcode-table"></div><div class="barcode-actions"><button id="barcode-confirm" class="btn gold" disabled>تأكيد التسليم للشركة</button><button id="barcode-clear" class="btn dark">تفريغ القائمة</button></div></section>
<section class="barcode-section"><h3>كشف الطلبات المسلّمة لشركات التوصيل</h3><div class="ops-grid"><label>من تاريخ<input id="barcode-report-from" type="date"></label><label>إلى تاريخ<input id="barcode-report-to" type="date"></label><label>الشركة<select id="barcode-report-company"><option value="">جميع الشركات</option></select></label></div><div class="barcode-actions"><button id="barcode-report-load" class="btn gold">عرض كشف التسليم</button><button id="barcode-report-pdf" class="btn dark" disabled>تنزيل الكشف PDF</button><button id="barcode-report-csv" class="btn dark" disabled>تنزيل الكشف Excel / CSV</button></div><p id="barcode-report-notice" class="ops-status" role="status"></p><div id="barcode-report-summary"></div><div id="barcode-report" class="barcode-table"></div></section>
</section>
<script>
window.AdminBarcode=(()=>{
 const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 let mode='inquiry',queue=[],pending=null,report=null,busy=false,epoch=0,controls=null,cameraEpoch=0,scannerPromise=null;
 $('portal-barcode').append($('barcodePanel'));$('barcodePanel').hidden=false;
 const money=n=>Number(n||0).toFixed(2)+' د',date=v=>v?new Intl.DateTimeFormat('ar-JO',{timeZone:'Asia/Amman',dateStyle:'medium',timeStyle:'medium'}).format(new Date(v)):'—';
 const rpc=async(name,args=[])=>{const e=epoch,result=await AdminPortal.rpc(name,args);if(e!==epoch)throw Error('انتهت الجلسة.');return result;};
 function notice(text,error=false,id='barcode-notice'){$(id).textContent=text;$(id).dataset.error=String(error);}
 function buttons(){['barcode-read','barcode-camera','barcode-image','barcode-confirm','barcode-clear','barcode-setup','barcode-report-load','barcode-report-pdf','barcode-report-csv','barcode-mode-handover','barcode-mode-inquiry','barcode-company','barcode-company-new','barcode-report-from','barcode-report-to','barcode-report-company','barcode-kind','barcode-value'].forEach(id=>$(id).disabled=busy);$('barcode-mode-handover').disabled=busy||!AdminPortal.allowed('barcodeHandover');$('barcode-confirm').disabled=busy||!queue.length||!AdminPortal.allowed('barcodeHandover');$('barcode-report-pdf').disabled=busy||!report?.rows.length;$('barcode-report-csv').disabled=busy||!report?.rows.length;document.querySelectorAll('[data-barcode-remove]').forEach(b=>b.disabled=busy||!!pending);$('barcode-clear').disabled=busy||!!pending;$('barcode-company').disabled=busy||!!pending;$('barcode-company-new').disabled=busy||!!pending;}
 async function run(fn,id='barcode-notice'){if(busy)return;const e=epoch;stopCamera();busy=true;buttons();notice('جارٍ تنفيذ العملية...',false,id);try{await fn();}catch(err){if(e===epoch)notice((err.message||String(err)).replace(/^Error:\s*/,''),true,id);}finally{if(e===epoch){busy=false;buttons();}}}
 function company(){return ($('barcode-company').value==='__new'?$('barcode-company-new').value:$('barcode-company').value).trim();}
 function setMode(value){if(busy)return;stopCamera();mode=value;$('barcode-mode-handover').setAttribute('aria-pressed',String(mode==='handover'));$('barcode-mode-inquiry').setAttribute('aria-pressed',String(mode==='inquiry'));$('barcode-company-box').hidden=mode!=='handover';$('barcode-cart-box').hidden=mode!=='handover';$('barcode-inquiry').hidden=true;$('barcode-read').textContent=mode==='handover'?'إضافة الطلب للدفعة':'عرض معلومات الطلب';notice(mode==='handover'?'اختر الشركة ثم امسح باركود الطلبات.':'امسح الباركود لعرض معلومات الطلب وحالة تسليمه.');buttons();}
 function renderQueue(){$('barcode-cart').innerHTML=queue.length?'<p>عدد الطلبات: '+queue.length+' — إجمالي التحصيل: '+money(queue.reduce((s,o)=>s+o.due,0))+'</p><table><thead><tr><th>الطلب</th><th>الباركود</th><th>الاسم</th><th>المحافظة</th><th>التحصيل</th><th></th></tr></thead><tbody>'+queue.map(o=>'<tr><td>'+esc(o.orderNumber)+'</td><td>'+esc(o.barcode)+'</td><td>'+esc(o.name)+'</td><td>'+esc(o.governorate)+'</td><td>'+money(o.due)+'</td><td><button class="btn dark" data-barcode-remove="'+esc(o.key)+'">إزالة</button></td></tr>').join('')+'</tbody></table>':'<p>لم تُضف طلبات للدفعة بعد.</p>';$('barcode-cart').querySelectorAll('[data-barcode-remove]').forEach(b=>b.onclick=()=>{queue=queue.filter(o=>o.key!==b.dataset.barcodeRemove);renderQueue();buttons();});}
 async function read(kind,value){if(mode==='handover'&&pending){notice('أعد تأكيد الدفعة الحالية للتحقق من نتيجة المحاولة السابقة.',true);return;}if(mode==='handover'&&company().length<2){notice('اختر شركة التوصيل أو أدخل اسمها أولًا.',true);return;}await run(async()=>{const o=await rpc('adminBarcodeLookup',[{kind,value}]);if(mode==='handover'){if(o.handover)throw Error('سبق تسليم الطلب #'+o.orderNumber+' إلى '+(o.handover.company||'شركة غير مسجلة')+' بتاريخ '+date(o.handover.handedAt));if(['ملغي','تم التسليم'].includes(o.status))throw Error('حالة الطلب '+o.status+'؛ لا يمكن إضافته.');if(queue.some(r=>r.key===o.key))throw Error('الطلب موجود في الدفعة بالفعل.');if(queue.length>=200)throw Error('أكد الدفعة الحالية قبل إضافة طلبات أخرى (200 طلب).');queue.push(o);renderQueue();notice('أضيف الطلب #'+o.orderNumber+' إلى الدفعة. امسح الطلب التالي.');$('barcode-value').value='';}else{$('barcode-inquiry').hidden=false;$('barcode-inquiry').textContent=['الطلب #'+o.orderNumber+' — الباركود: '+(o.barcode||'غير مثبت'),'الاسم: '+o.name,'الهاتف: '+o.phone+(o.altPhone?' — البديل: '+o.altPhone:''),'العنوان: '+[o.governorate,o.district,o.address].filter(Boolean).join(' — '),'حالة الطلب: '+o.status,'المبلغ المطلوب تحصيله: '+money(o.due),'تفاصيل المنتجات:\n'+o.itemsText,o.handover?'تم تسليم الطلب لشركة التوصيل: '+(o.handover.company||'غير مسجلة (تسليم سابق)')+'\nتاريخ ووقت التسليم: '+date(o.handover.handedAt)+'\nالموظف: '+o.handover.handedBy:'لم يُسجّل تسليم الطلب لشركة التوصيل.'].join('\n');notice('تم عرض معلومات الطلب.');}});}
 async function refreshConfig(){const data=await rpc('adminBarcodeConfig'),selected=$('barcode-company').value,filter=$('barcode-report-company').value;$('barcode-company').replaceChildren(new Option('اختر الشركة',''),...data.companies.map(n=>new Option(n,n)),new Option('إضافة اسم شركة','__new'));$('barcode-company').value=data.companies.includes(selected)||selected==='__new'?selected:'';$('barcode-report-company').replaceChildren(new Option('جميع الشركات',''),...data.companies.map(n=>new Option(n,n)));$('barcode-report-company').value=data.companies.includes(filter)?filter:'';if(!$('barcode-report-from').value)$('barcode-report-from').value=data.today;if(!$('barcode-report-to').value)$('barcode-report-to').value=data.today;$('barcode-setup').hidden=data.sheetReady||!AdminPortal.isNative();}
 const headers=['رقم الطلب','الباركود','الاسم','الهاتف','المحافظة','شركة التوصيل','التاريخ والوقت (الأردن)','الموظف','التحصيل','التوصيل','المستحق من الشركة'];
 function cells(r){return[r.orderNumber,r.barcode,r.name,r.phone,r.governorate,r.company||'غير مسجلة (تسليم سابق)',r.handedDisplay||date(r.handedAt),r.handedBy,money(r.due),money(r.delivery),money(r.companyDue)];}
 function table(rows){return '<table><thead><tr>'+headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cells(r).map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';}
 function renderReport(data){report=data;$('barcode-report-summary').innerHTML='<div class="barcode-summary"><span>عدد الطلبات: '+data.count+'</span><span>إجمالي التحصيل: '+money(data.due)+'</span><span>التوصيل: '+money(data.delivery)+'</span><span>المستحق من الشركة: '+money(data.companyDue)+'</span></div><p>'+esc(data.from)+' — '+esc(data.to)+' · '+esc(data.company||'جميع الشركات')+' · بتوقيت الأردن</p>';$('barcode-report').innerHTML=data.rows.length?table(data.rows):'<p>لا توجد طلبات مسلّمة ضمن الفترة والشركة المحددتين.</p>';}
 $('barcode-mode-handover').onclick=()=>setMode('handover');$('barcode-mode-inquiry').onclick=()=>setMode('inquiry');$('barcode-company').onchange=()=>{$('barcode-company-new-box').hidden=$('barcode-company').value!=='__new';};$('barcode-read').onclick=()=>read($('barcode-kind').value,$('barcode-value').value);$('barcode-value').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('barcode-read').click();}};$('barcode-clear').onclick=()=>{if(!queue.length||confirm('تفريغ قائمة المسح الحالية؟')){queue=[];renderQueue();buttons();}};
 $('barcode-confirm').onclick=()=>{const name=company();if(name.length<2){notice('اختر شركة التوصيل أو أدخل اسمها.',true);return;}if(!pending&&!confirm('تأكيد التسليم الفعلي لـ '+queue.length+' طلب إلى شركة '+name+'؟'))return;pending=pending||{id:'handover_'+crypto.randomUUID(),company:name,orders:queue.map(o=>({key:o.key,revision:o.revision,barcode:o.barcode}))};run(async()=>{let result;try{result=await rpc('adminBarcodeHandover',[pending]);}catch(e){if(/سبق تسليم|تغيرت بيانات|حُذف طلب|حالته|معرف الدفعة مستخدم|أضف من|مكرر|اختر شركة/.test(e.message||String(e)))pending=null;throw e;}queue=[];pending=null;renderQueue();await refreshConfig();notice('تم تسليم '+result.rows.length+' طلب إلى '+name+' وتحديث الخانة واللون في كشف Drive.');const day=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Amman',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(result.rows[0].handedAt));$('barcode-report-from').value=day;$('barcode-report-to').value=day;$('barcode-report-company').value=name;renderReport(await rpc('adminBarcodeReport',[{from:day,to:day,company:name}]));});};
 $('barcode-setup').onclick=()=>run(async()=>{await rpc('adminBarcodeSetup');await refreshConfig();notice('أصبحت أعمدة التسليم جاهزة في كشف Drive.');});$('barcode-report-load').onclick=()=>run(async()=>{renderReport(await rpc('adminBarcodeReport',[{from:$('barcode-report-from').value,to:$('barcode-report-to').value,company:$('barcode-report-company').value}]));notice('تم تحميل كشف التسليم.',false,'barcode-report-notice');},'barcode-report-notice');
 function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);}
 $('barcode-report-csv').onclick=()=>{if(!report)return;const safe=v=>{v=String(v??'');if(/^[=+@\-]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"';};download(new Blob(['\ufeff'+[headers,...report.rows.map(cells)].map(r=>r.map(safe).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),'كشف_تسليم_'+report.from+'_'+report.to+'.csv');};
 $('barcode-report-pdf').onclick=()=>run(async()=>{if(!report?.rows.length)return;const snapshot=report,render=await AdminPortal.loadPdfRenderer();await document.fonts.ready;const host=document.createElement('div');host.style.cssText='position:fixed;left:-10000px;top:0;width:1123px;background:white;direction:rtl;';document.body.append(host);const pages=[],images=[];function layout(rows,page,total){return '<article style="box-sizing:border-box;width:1123px;padding:24px;background:#fff;color:#111;font:14px Tajawal,Arial;direction:rtl"><h2 style="margin:0 0 8px">كشف تسليم الطلبات لشركة التوصيل</h2><p style="margin:6px 0">'+esc(snapshot.from)+' — '+esc(snapshot.to)+' | '+esc(snapshot.company||'جميع الشركات')+' | الوقت بتوقيت الأردن</p><p style="margin:6px 0">عدد الطلبات: '+snapshot.count+' — التحصيل: '+money(snapshot.due)+' — التوصيل: '+money(snapshot.delivery)+' — المستحق من الشركة: '+money(snapshot.companyDue)+'</p><style>.barcode-pdf table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px}.barcode-pdf td,.barcode-pdf th{padding:6px;border:1px solid #aaa;overflow-wrap:anywhere;line-height:1.5;text-align:right}.barcode-pdf th{background:#eee}</style><div class="barcode-pdf">'+table(rows)+'</div><p style="margin:10px 0 0">صفحة '+page+' / '+total+'</p></article>';}
 try{let chunk=[];for(const row of snapshot.rows){chunk.push(row);host.innerHTML=layout(chunk,1,9999);if(host.firstElementChild.getBoundingClientRect().height>760){chunk.pop();if(!chunk.length)throw Error('أحد أسطر الكشف طويل جدًا. نزّل كشف Excel.');pages.push(chunk);chunk=[row];}}if(chunk.length)pages.push(chunk);for(let i=0;i<pages.length;i++){host.innerHTML=layout(pages[i],i+1,pages.length);host.firstElementChild.style.height='794px';const canvas=await render(host.firstElementChild,{backgroundColor:'#fff',width:1123,height:794,scale:2,logging:false});images.push(Uint8Array.from(atob(canvas.toDataURL('image/jpeg',.95).split(',')[1]),c=>c.charCodeAt(0)));canvas.width=canvas.height=0;notice('تجهيز PDF: '+(i+1)+' من '+pages.length,false,'barcode-report-notice');}download(stickerPdf(images,{width:841.889764,height:595.275591,imageWidth:2246,imageHeight:1588}),'كشف_تسليم_'+snapshot.from+'_'+snapshot.to+'.pdf');notice('تم تنزيل كشف التسليم PDF.',false,'barcode-report-notice');}finally{host.remove();}},'barcode-report-notice');
 function loadScanner(){if(window.ZXingBrowser)return Promise.resolve(window.ZXingBrowser);if(!scannerPromise)scannerPromise=new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js';s.onload=()=>window.ZXingBrowser?resolve(window.ZXingBrowser):reject(Error('تعذر تحميل قارئ الباركود.'));s.onerror=()=>{scannerPromise=null;s.remove();reject(Error('تعذر تحميل القارئ. استخدم الرقم اليدوي.'));};document.head.append(s);});return scannerPromise;}
 function stopCamera(){cameraEpoch++;controls?.stop();controls=null;const video=$('barcode-video');video.srcObject?.getTracks().forEach(t=>t.stop());video.srcObject=null;$('barcode-camera-box').hidden=true;}
 $('barcode-camera').onclick=async()=>{if(busy)return;if(mode==='handover'&&company().length<2){notice('اختر الشركة أولًا.',true);return;}stopCamera();const e=cameraEpoch;$('barcode-camera').disabled=true;try{const lib=await loadScanner();if(e!==cameraEpoch)return;$('barcode-camera-box').hidden=false;const c=await new lib.BrowserMultiFormatOneDReader().decodeFromConstraints({video:{facingMode:{ideal:'environment'}},audio:false},$('barcode-video'),(result,error,ctrl)=>{if(!result||e!==cameraEpoch)return;const value=result.getText();if(!/^\d{1,12}$/.test(value))return;ctrl.stop();stopCamera();$('barcode-kind').value='barcode';$('barcode-value').value=value;read('barcode',value);});if(e!==cameraEpoch)c.stop();else controls=c;}catch(err){stopCamera();notice('تعذر تشغيل الكاميرا. اسمح بالكاميرا من المتصفح أو استخدم الصورة أو الرقم اليدوي.',true);}finally{buttons();}};$('barcode-stop').onclick=stopCamera;
 $('barcode-image').onchange=async()=>{const file=$('barcode-image').files[0],session=epoch;if(!file||busy)return;stopCamera();try{const lib=await loadScanner(),url=URL.createObjectURL(file);let value;try{value=(await new lib.BrowserMultiFormatOneDReader().decodeFromImageUrl(url)).getText();}finally{URL.revokeObjectURL(url);}if(session!==epoch)return;$('barcode-kind').value='barcode';$('barcode-value').value=value;await read('barcode',value);}catch(err){notice('تعذرت قراءة الباركود من الصورة. جرّب صورة أوضح أو أدخل الرقم.',true);}finally{$('barcode-image').value='';}};
 document.addEventListener('visibilitychange',()=>{if(document.hidden)stopCamera();});window.addEventListener('pagehide',stopCamera);
 function reset(){epoch++;stopCamera();queue=[];pending=null;report=null;busy=false;$('barcode-inquiry').textContent='';$('barcode-inquiry').hidden=true;$('barcode-report').replaceChildren();$('barcode-report-summary').replaceChildren();$('barcode-value').value='';$('barcode-company-new').value='';$('barcode-company').value='';renderQueue();}
 return {enter:()=>{if(!AdminPortal.allowed('barcodeHandover'))setMode('inquiry');return run(async()=>{await refreshConfig();notice(mode==='handover'?'اختر الشركة وامسح الطلبات.':'امسح الباركود للاستعلام عن الطلب.');});},leave:stopCamera,reset,sessionChanged:buttons};
})();
</script>

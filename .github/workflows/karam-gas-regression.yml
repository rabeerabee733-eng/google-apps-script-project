name: Karam Google Apps Script regression
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      matrix:
        node: ['22.23.4', '24.22.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test --test-concurrency=2 --test-timeout=120000 tests/*.test.cjs tests/*.test.mjs

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>التحضير الإلكتروني</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f4f4fc;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .frame-wrapper {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .fallback-link {
      position: fixed;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      color: #fff;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <!-- هنا نحمّل صفحة Google Apps Script كاملة داخل iframe -->
  <div class="frame-wrapper">
    <iframe
      src="https://script.google.com/macros/s/AKfycbwW9rdlUjbys4s02BbW1nUhZfiXukoQeTLset9PTXDHVQ8IGXC8QPEo5e1kQ3GYBMzAXA/exec"
      allowfullscreen
      loading="lazy">
    </iframe>
  </div>

  </body>
</html>

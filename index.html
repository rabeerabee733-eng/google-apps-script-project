<script>
  // رابط تطبيق Apps Script (نفس الرابط الذي أرسلتيه)
  const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbzHUvvHCFiNjG-QyHocU5X-KKWt7dsNASGNO7ZOwIjoZAfZV2zpLHCy5CIXRT2rjfEK3A/exec";

  var WHATSAPP_NUMBER = "0798382004";

  var districtsByGov = {
    "عمان": ["قصبة عمان","لواء ماركا","لواء القويسمة","لواء الجامعة","لواء وادي السير","لواء ناعور","لواء سحاب","لواء الجيزة","لواء الموقر"],
    "إربد": ["قصبة إربد","لواء بني عبيد","لواء المزار الشمالي","لواء الرمثا","لواء بني كنانة","لواء الكورة","لواء الأغوار الشمالية","لواء الطيبة","لواء الوسطية"],
    "الزرقاء": ["قصبة الزرقاء","لواء الرصيفة","لواء الهاشمية","لواء بيرين"],
    "البلقاء": ["قصبة السلط","لواء الشونة الجنوبية","لواء دير علا","لواء عين الباشا","لواء ماحص والفحيص"],
    "المفرق": ["قصبة المفرق","لواء الرويشد","لواء البادية الشمالية","لواء البادية الشمالية الغربية","لواء بلعما"],
    "جرش": ["قصبة جرش"],
    "عجلون": ["قصبة عجلون","لواء كفرنجة","لواء القويسمة"],
    "مأدبا": ["قصبة مأدبا","لواء ذيبان"],
    "الكرك": ["قصبة الكرك","لواء المزار الجنوبي","لواء الأغوار الجنوبية","لواء القصر","لواء القطرانة","لواء عي","لواء فقوع"],
    "الطفيلة": ["قصبة الطفيلة","لواء بصيرا","لواء الحسا"],
    "معان": ["قصبة معان","لواء البتراء (إقليم البتراء)","لواء الشوبك","لواء الحسينية"],
    "العقبة": ["قصبة العقبة","لواء القويرة","لواء وادي عربة"]
  };

  var lastOrder = null;
  var lastOrderNumber = null;
  var errorBox = null;
  var errorText = null;

  window.addEventListener("load", function () {
    var logoImg = document.getElementById("logo-img");
    var fallback = document.getElementById("logo-fallback");
    if (!logoImg) return;

    if (!logoImg.complete || logoImg.naturalWidth === 0) {
      logoImg.style.display = "none";
      if (fallback) fallback.style.display = "flex";
    } else {
      if (fallback) fallback.style.display = "none";
    }
  });

  document.addEventListener("DOMContentLoaded", function() {
    errorBox = document.getElementById("error-box");
    errorText = document.getElementById("error-text");
    calculateTotals();
  });

  function showScreen(name) {
    var main = document.getElementById("screen-main");
    var confirm = document.getElementById("screen-confirm");
    var track = document.getElementById("screen-track");
    main.className = "screen";
    confirm.className = "screen";
    track.className = "screen";
    if (name === "main") main.className = "screen active";
    if (name === "confirm") confirm.className = "screen active";
    if (name === "track") track.className = "screen active";
    clearError();
    window.scrollTo(0, 0);
  }

  function changeQty(button, delta) {
    var wrapper = button.parentNode;
    var valueEl = wrapper.querySelector(".qty-value");
    var value = parseInt(valueEl.textContent, 10);
    if (isNaN(value)) value = 0;
    value = value + delta;
    if (value < 0) value = 0;
    valueEl.textContent = value;
    calculateTotals();
  }

  function calculateTotals() {
    var productsTotal = 0;
    var itemsCount = 0;

    var controls = document.querySelectorAll(".qty-control");
    for (var i = 0; i < controls.length; i++) {
      var ctrl = controls[i];
      var price = parseFloat(ctrl.getAttribute("data-price")) || 0;
      var qtyEl = ctrl.querySelector(".qty-value");
      var qty = parseInt(qtyEl.textContent, 10);
      if (isNaN(qty)) qty = 0;
      productsTotal += price * qty;
      itemsCount += qty;
    }

    var governorateSelect = document.getElementById("governorate");
    var governorate = governorateSelect ? governorateSelect.value : "";
    var deliveryFee = 0;
    if (governorate) {
      deliveryFee = governorate === "عمان" ? 2 : 3;
    }

    var grandTotal = productsTotal + deliveryFee;

    document.getElementById("items-count").textContent = itemsCount + " منتج";
    document.getElementById("products-total").textContent = productsTotal + " دنانير";
    document.getElementById("delivery-fee").textContent = deliveryFee + " دنانير";
    document.getElementById("grand-total").textContent = grandTotal + " دنانير";
  }

  function onGovernorateChange() {
    var govSelect = document.getElementById("governorate");
    var districtSelect = document.getElementById("district");
    var gov = govSelect.value;

    districtSelect.innerHTML = '<option value="" selected disabled>اختر اللواء...</option>';

    if (districtsByGov[gov]) {
      districtsByGov[gov].forEach(function (d) {
        var opt = document.createElement("option");
        opt.value = d;
        opt.textContent = d;
        districtSelect.appendChild(opt);
      });
      districtSelect.disabled = false;
    } else {
      districtSelect.disabled = true;
    }

    calculateTotals();
  }

  function extractNumber(text) {
    if (!text) return 0;
    var num = parseFloat(text.replace(/[^\d.]/g, ""));
    return isNaN(num) ? 0 : num;
  }

  function collectOrderData() {
    calculateTotals();

    var order = {};
    order.name = document.getElementById("name").value || "";
    order.phone = document.getElementById("phone").value || "";
    order.altPhone = document.getElementById("altPhone").value || "";
    order.address = document.getElementById("address").value || "";
    order.notes = document.getElementById("notes").value || "";
    var govSelect = document.getElementById("governorate");
    var distSelect = document.getElementById("district");
    order.governorate = govSelect ? govSelect.value : "";
    order.district = distSelect ? distSelect.value : "";
    order.cod = false;

    order.itemsCount = extractNumber(document.getElementById("items-count").textContent);
    order.productsTotal = extractNumber(document.getElementById("products-total").textContent);
    order.deliveryFee = extractNumber(document.getElementById("delivery-fee").textContent);
    order.grandTotal = extractNumber(document.getElementById("grand-total").textContent);

    order.items = [];
    var rows = document.querySelectorAll(".product-row");
    for (var i = 0; i < rows.length; i++) {
      var row = rows[i];
      var nameSpan = row.querySelector(".product-name");
      var ctrl = row.querySelector(".qty-control");
      var qtyValue = ctrl.querySelector(".qty-value");
      var price = parseFloat(ctrl.getAttribute("data-price")) || 0;
      var qty = parseInt(qtyValue.textContent, 10) || 0;
      if (qty > 0) {
        order.items.push({
          name: nameSpan ? nameSpan.textContent.trim() : "",
          price: price,
          qty: qty
        });
      }
    }

    return order;
  }

  function enforceNumeric(input) {
    input.value = input.value.replace(/\D/g, "");
    if (input.value.length > 10) {
      input.value = input.value.slice(0, 10);
    }
  }

  function isValidPhone(phone) {
    var digits = phone.replace(/\D/g, "");
    var regex = /^07\d{8}$/;
    return regex.test(digits);
  }

  function clearError() {
    if (!errorBox || !errorText) return;
    errorText.textContent = "";
    errorBox.classList.add("hidden");
  }

  function showError(msg) {
    if (!errorBox || !errorText) return;
    errorText.textContent = msg;
    errorBox.classList.remove("hidden");
  }

  function validateRequiredFields() {
    clearError();

    var nameEl = document.getElementById("name");
    var phoneEl = document.getElementById("phone");
    var altPhoneEl = document.getElementById("altPhone");
    var addressEl = document.getElementById("address");

    nameEl.classList.remove("required-error");
    phoneEl.classList.remove("required-error");
    altPhoneEl.classList.remove("required-error");
    addressEl.classList.remove("required-error");

    var missing = [];

    if (!nameEl.value.trim()) {
      missing.push("الاسم");
      nameEl.classList.add("required-error");
    }
    if (!phoneEl.value.trim()) {
      missing.push("رقم الهاتف الأساسي");
      phoneEl.classList.add("required-error");
    }
    if (!addressEl.value.trim()) {
      missing.push("العنوان التفصيلي");
      addressEl.classList.add("required-error");
    }

    if (missing.length > 0) {
      showError("الرجاء تعبئة الحقول التالية:\n- " + missing.join("\n- "));
      if (nameEl.classList.contains("required-error")) nameEl.focus();
      else if (phoneEl.classList.contains("required-error")) phoneEl.focus();
      else if (addressEl.classList.contains("required-error")) addressEl.focus();
      return false;
    }

    var phoneVal = phoneEl.value.trim();
    if (!isValidPhone(phoneVal)) {
      phoneEl.classList.add("required-error");
      showError("رقم الهاتف الأساسي غير صحيح. يجب أن يبدأ بـ 07 ويتكون من 10 خانات.");
      phoneEl.focus();
      return false;
    }

    var altVal = altPhoneEl.value.trim();
    if (altVal && !isValidPhone(altVal)) {
      altPhoneEl.classList.add("required-error");
      showError("رقم الهاتف البديل غير صحيح. إذا أدخلته، يجب أن يبدأ بـ 07 ويتكون من 10 خانات.");
      altPhoneEl.focus();
      return false;
    }

    return true;
  }

  function fillConfirmScreen(orderNumber) {
    lastOrderNumber = orderNumber;

    var orderNumberEl = document.getElementById("order-number");
    if (orderNumberEl) {
      orderNumberEl.textContent = orderNumber;
    }

    if (!lastOrder) return;

    var ci = document.getElementById("confirm-items");
    var cpt = document.getElementById("confirm-products-total");
    var cdf = document.getElementById("confirm-delivery-fee");
    var cgt = document.getElementById("confirm-grand-total");

    if (ci) ci.textContent = lastOrder.itemsCount + " منتج";
    if (cpt) cpt.textContent = lastOrder.productsTotal + " دنانير";
    if (cdf) cdf.textContent = lastOrder.deliveryFee + " دنانير";
    if (cgt) cgt.textContent = lastOrder.grandTotal + " دنانير";
  }

  function buildWhatsAppMessage(orderNumber) {
    var itemsText = "";
    if (lastOrder.items && lastOrder.items.length > 0) {
      itemsText = lastOrder.items.map(function (item, index) {
        var name = item.name || "";
        var icon = "🛍";

        if (name.indexOf("حقيبة") !== -1) icon = "🎒";
        else if (name.indexOf("تحضير") !== -1) icon = "📚";
        else if (name.indexOf("الحروف") !== -1) icon = "🔠";
        else if (name.indexOf("الأرقام") !== -1 || name.indexOf("الارقام") !== -1) icon = "🔢";

        var lineTotal = item.price * item.qty;
        return icon + " " + (index + 1) + ") " + name + " × " + item.qty + " = " + lineTotal + " د";
      }).join("\n");
    } else {
      itemsText = "- لم يتم اختيار منتجات.";
    }

    var message =
      "أهلاً وسهلاً فيكم مع *💜 التحضير الإلكتروني 💜* 🌟\n" +
      "يسعدنا اختياركم لمنتجاتنا التعليمية، وشكراً على ثقتكم بنا 💜\n" +
      "تم استلام طلبكم بنجاح، وسنتواصل معكم قريباً لتأكيد التفاصيل وموعد التوصيل 🚚✨\n\n" +
      "📌 *تفاصيل الطلب:*\n\n" +
      "رقم الطلب: " + orderNumber + "\n" +
      "الاسم: " + (lastOrder.name || "-") + "\n" +
      "الهاتف: " + (lastOrder.phone || "-") + "\n" +
      "هاتف بديل: " + (lastOrder.altPhone || "-") + "\n" +
      "المحافظة: " + (lastOrder.governorate || "-") + "\n" +
      "اللواء: " + (lastOrder.district || "-") + "\n" +
      "📍 العنوان: " + (lastOrder.address || "-") + "\n\n" +
      "🛍 *المنتجات:*\n" + itemsText + "\n\n" +
      "💵 مجموع المنتجات: " + lastOrder.productsTotal + " دنانير\n" +
      "🚚 رسوم التوصيل: " + lastOrder.deliveryFee + " دنانير\n" +
      "💰 الإجمالي الكلي: " + lastOrder.grandTotal + " دنانير\n\n" +
      "✏️ ملاحظات العميل: " + (lastOrder.notes || "-") + "\n\n" +
      "في حال رغبتم بتعديل الطلب لاحقاً، يمكنكم مراسلتنا على هذا الرقم مع ذكر رقم الطلب.\n\n" +
      "تابعونا على فيسبوك لكل جديد وأفكار وأنشطة تعليمية 👇\n" +
      "📘 فيسبوك: https://www.facebook.com/ta7deer/";

    return message;
  }

  function openWhatsAppWithOrder(orderNumber) {
    if (!lastOrder) return;

    var raw = WHATSAPP_NUMBER.replace(/\D/g, "");
    raw = raw.replace(/^0/, "");
    var intlPhone = "962" + raw;

    var message = buildWhatsAppMessage(orderNumber);
    var url = "https://api.whatsapp.com/send?phone=" + intlPhone +
              "&text=" + encodeURIComponent(message);

    window.location.href = url;
  }

  // تأخير 4 ثوانٍ قبل فتح الواتساب
  function sendWhatsAppFromConfirm() {
    if (!lastOrder || !lastOrderNumber) {
      alert("لا توجد بيانات طلب جاهزة للإرسال عبر واتساب.");
      return;
    }

    var btn = document.getElementById("btn-whatsapp-confirm");
    if (btn) {
      btn.disabled = true;
      btn.textContent = "جاري فتح واتساب...";
    }

    setTimeout(function () {
      openWhatsAppWithOrder(lastOrderNumber);
      if (btn) {
        btn.disabled = false;
        btn.textContent = "إرسال الطلب عبر واتساب";
      }
    }, 4000);
  }

  function requestEdit() {
    var raw = WHATSAPP_NUMBER.replace(/\D/g, "");
    raw = raw.replace(/^0/, "");
    var intlPhone = "962" + raw;

    var msg =
      "مرحباً 👋\n" +
      "أرغب بتعديل طلبي السابق من *💜 التحضير الإلكتروني 💜*.\n\n" +
      "رقم الطلب: ________\n" +
      "التعديل المطلوب:\n" +
      "- ..................................\n" +
      "- ..................................";

    var url = "https://api.whatsapp.com/send?phone=" + intlPhone +
              "&text=" + encodeURIComponent(msg);

    window.location.href = url;
  }

  function onSubmitClick() {
    if (!validateRequiredFields()) {
      return;
    }

    var itemsCountText = document.getElementById("items-count").textContent;
    var itemsCount = extractNumber(itemsCountText);
    if (!itemsCount || itemsCount === 0) {
      showError("الرجاء اختيار منتج واحد على الأقل قبل إرسال الطلب.");
      return;
    }

    var order = collectOrderData();
    lastOrder = order;

    // إرسال الطلب إلى Google Apps Script عبر fetch
    fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(order)
    })
      .then(function (res) {
        return res.json();
      })
      .then(function (data) {
        console.log("server response:", data);
        clearError();
        var orderNumber = data && data.orderNumber ? data.orderNumber : "غير متوفر";
        fillConfirmScreen(orderNumber);
        showScreen("confirm");
      })
      .catch(function (err) {
        console.error(err);
        showError("حدث خطأ أثناء حفظ الطلب في Google Sheets. يمكنك المحاولة لاحقاً أو التواصل معنا عبر الهاتف.");
        fillConfirmScreen("غير متوفر");
        showScreen("confirm");
      });
  }

  function callUs() {
    window.location.href = "tel:0798382004";
  }
</script>

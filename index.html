<script>
    // 🔴🔴🔴 هام: استبدل هذا الرابط برابط Web App الخاص بك 🔴🔴🔴
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyU15t3eEZRHgvNO87UQQX7qhbKXcR82D8LhkUzYdRm0_bGkiOMea2HkT8KJ_A1RM5kFA/exec"; 

    var WHATSAPP_NUMBER = "0798382004";
    
    // بيانات الألوية (لم تتغير)
    var districtsByGov={"عمان":["قصبة عمان","لواء ماركا","لواء القويسمة","لواء الجامعة","لواء وادي السير","لواء ناعور","لواء سحاب","لواء الجيزة","لواء الموقر"],"إربد":["قصبة إربد","لواء بني عبيد","لواء المزار الشمالي","لواء الرمثا","لواء بني كنانة","لواء الكورة","لواء الأغوار الشمالية","لواء الطيبة","لواء الوسطية"],"الزرقاء":["قصبة الزرقاء","لواء الرصيفة","لواء الهاشمية","لواء بيرين"],"البلقاء":["قصبة السلط","لواء الشونة الجنوبية","لواء دير علا","لواء عين الباشا","لواء ماحص والفحيص"],"المفرق":["قصبة المفرق","لواء الرويشد","لواء البادية الشمالية","لواء البادية الشمالية الغربية","لواء بلعما"],"جرش":["قصبة جرش"],"عجلون":["قصبة عجلون","لواء كفرنجة","لواء القويسمة"],"مأدبا":["قصبة مأدبا","لواء ذيبان"],"الكرك":["قصبة الكرك","لواء المزار الجنوبي","لواء الأغوار الجنوبية","لواء القصر","لواء القطرانة","لواء عي","لواء فقوع"],"الطفيلة":["قصبة الطفيلة","لواء بصيرا","لواء الحسا"],"معان":["قصبة معان","لواء البتراء (إقليم البتراء)","لواء الشوبك","لواء الحسينية"],"العقبة":["قصبة العقبة","لواء القويرة","لواء وادي عربة"]};
    var lastOrder=null,lastOrderNumber=null;

    // عند تحميل الصفحة
    window.addEventListener("load",function(){
      var img=document.getElementById("logo-img"), fb=document.getElementById("logo-fallback");
      if(img && (!img.complete || img.naturalWidth===0)) { img.style.display="none"; fb.style.display="flex"; }
    });

    // ✅ دالة تغيير الكمية (تم تحسينها)
    function changeQty(btn, delta) {
      // البحث عن الحاوية الرئيسية للزر
      var wrapper = btn.closest(".qty-control");
      if (!wrapper) return; // حماية من الأخطاء

      // البحث عن عنصر الرقم داخل الحاوية
      var valEl = wrapper.querySelector(".qty-value");
      if (!valEl) return;

      // قراءة الرقم الحالي
      var currentVal = parseInt(valEl.innerText || valEl.textContent) || 0;
      
      // حساب الرقم الجديد
      var newVal = currentVal + delta;
      
      // منع الأرقام السالبة
      if (newVal < 0) newVal = 0;

      // تحديث الشاشة
      valEl.innerText = newVal;

      // إعادة حساب المجموع الكلي فوراً
      calculateTotals();
    }

    // ✅ دالة حساب المجاميع (تم تحسينها)
    function calculateTotals() {
      var total = 0;
      var count = 0;

      // المرور على كل المنتجات وحساب المختار منها فقط
      var controls = document.querySelectorAll(".qty-control");
      controls.forEach(function(ctrl) {
        var price = parseFloat(ctrl.getAttribute("data-price")) || 0;
        var qtyEl = ctrl.querySelector(".qty-value");
        var qty = parseInt(qtyEl.innerText || qtyEl.textContent) || 0;
        
        total += (price * qty);
        count += qty;
      });

      // حساب التوصيل
      var gov = document.getElementById("governorate").value;
      var delivery = 0;
      if (gov) {
        delivery = (gov === "عمان") ? 2 : 3;
      }

      // تحديث واجهة الملخص
      if(document.getElementById("items-count")) document.getElementById("items-count").textContent = count + " منتج";
      if(document.getElementById("products-total")) document.getElementById("products-total").textContent = total + " دنانير";
      if(document.getElementById("delivery-fee")) document.getElementById("delivery-fee").textContent = delivery + " دنانير";
      if(document.getElementById("grand-total")) document.getElementById("grand-total").textContent = (total + delivery) + " دنانير";
    }

    // باقي الدوال كما هي...
    function showScreen(name){
      document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
      document.getElementById("screen-"+name).classList.add("active");
      document.getElementById("error-box").classList.remove("visible");
      window.scrollTo(0,0);
    }

    function onGovernorateChange(){
      var g=document.getElementById("governorate").value;
      var d=document.getElementById("district");
      d.innerHTML='<option value="" selected disabled>اختر اللواء...</option>';
      if(districtsByGov[g]){
        districtsByGov[g].forEach(function(x){
          var o=document.createElement("option"); o.value=x; o.textContent=x; d.appendChild(o);
        });
        d.disabled=false;
      } else { d.disabled=true; }
      calculateTotals();
    }

    function collectOrderData(){
      calculateTotals();
      var items=[];
      document.querySelectorAll(".qty-control").forEach(function(ctrl){
        var wrapper = ctrl.closest(".product-row"); // التأكد من الصف الكامل
        if (!wrapper) return;
        
        var nameEl = wrapper.querySelector(".product-name");
        var qtyEl = ctrl.querySelector(".qty-value");
        
        var qty = parseInt(qtyEl.innerText || qtyEl.textContent)||0;
        
        if(qty > 0) {
          items.push({
            name: nameEl.textContent.trim(),
            price: parseFloat(ctrl.getAttribute("data-price")),
            qty: qty
          });
        }
      });

      // تنظيف الأرقام الإنجليزية وتحويلها لعربية إن وجدت أو العكس (للتوحيد)
      var phoneClean = document.getElementById("phone").value.trim();

      return {
        name:document.getElementById("name").value.trim(),
        phone: phoneClean,
        altPhone:document.getElementById("altPhone").value.trim(),
        address:document.getElementById("address").value.trim(),
        notes:document.getElementById("notes").value.trim(),
        governorate:document.getElementById("governorate").value,
        district:document.getElementById("district").value,
        itemsCount: parseInt(document.getElementById("items-count").textContent),
        productsTotal: parseFloat(document.getElementById("products-total").textContent),
        deliveryFee: parseFloat(document.getElementById("delivery-fee").textContent),
        grandTotal: parseFloat(document.getElementById("grand-total").textContent),
        items: items
      };
    }

    function showError(msg){
      var b=document.getElementById("error-box");
      document.getElementById("error-text").textContent=msg;
      b.classList.add("visible");
    }

    function validate(){
      document.querySelectorAll(".required-error").forEach(e=>e.classList.remove("required-error"));
      document.getElementById("error-box").classList.remove("visible");
      
      var n=document.getElementById("name"), p=document.getElementById("phone"), a=document.getElementById("address");
      var valid=true;

      if(!n.value.trim()){ n.classList.add("required-error"); valid=false; }
      if(!p.value.trim()){ p.classList.add("required-error"); valid=false; }
      if(!a.value.trim()){ a.classList.add("required-error"); valid=false; }
      
      if(!valid){ showError("الرجاء تعبئة الحقول المطلوبة (الاسم، الهاتف، العنوان)"); return false; }

      // السماح بالأرقام فقط في الهاتف
      var cleanPhone = p.value.replace(/\D/g,"");
      if(!/^07\d{8}$/.test(cleanPhone)){
        p.classList.add("required-error"); showError("رقم الهاتف غير صحيح (يجب أن يبدأ بـ 07 ويتكون من 10 خانات)"); return false;
      }
      return true;
    }

    function onSubmitClick(){
      if(!validate()) return;
      var count=parseInt(document.getElementById("items-count").textContent);
      if(count===0){ showError("الرجاء اختيار منتج واحد على الأقل"); return; }

      var order=collectOrderData();
      lastOrder=order;
      
      var btn=document.getElementById("btn-submit");
      btn.disabled=true; btn.textContent="جاري الإرسال...";

      fetch(WEB_APP_URL, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: "data=" + encodeURIComponent(JSON.stringify(order))
      })
      .then(response => response.json())
      .then(data => {
         if(data.result === 'success') {
             lastOrderNumber = data.orderNumber;
             document.getElementById("order-number").textContent = lastOrderNumber;
             
             // تعبئة شاشة التأكيد بالأرقام النهائية
             document.getElementById("confirm-items").textContent = order.itemsCount + " منتج";
             document.getElementById("confirm-products-total").textContent = order.productsTotal + " دنانير";
             document.getElementById("confirm-delivery-fee").textContent = order.deliveryFee + " دنانير";
             document.getElementById("confirm-grand-total").textContent = order.grandTotal + " دنانير";

             showScreen("confirm");
             setTimeout(function(){ sendWhatsAppFromConfirm(); }, 2000);
             btn.disabled=false; btn.textContent="إرسال الطلب";
         } else {
             console.error(data);
             showError("حدث خطأ: " + data.message);
             btn.disabled=false; btn.textContent="إرسال الطلب";
         }
      })
      .catch(error => {
         console.error(error);
         showError("فشل الاتصال بالخادم.");
         btn.disabled=false; btn.textContent="إرسال الطلب";
      });
    }

    function sendWhatsAppFromConfirm(){
      if(!lastOrder || !lastOrderNumber) return;
      var ph="962"+WHATSAPP_NUMBER.substring(1);
      
      var itemsTxt = lastOrder.items.map((i,idx)=> `▪️ ${i.name} (عدد: ${i.qty})`).join("\n");
      var msg = `*طلب جديد رقم ${lastOrderNumber}* 📦\n`+
                `👤 الاسم: ${lastOrder.name}\n`+
                `📱 الهاتف: ${lastOrder.phone}\n`+
                `📍 الموقع: ${lastOrder.governorate} - ${lastOrder.district}\n`+
                `🏠 العنوان: ${lastOrder.address}\n\n`+
                `🛒 *المنتجات:*\n${itemsTxt}\n\n`+
                `💰 الإجمالي: ${lastOrder.grandTotal} د.أ\n`+
                `📝 ملاحظات: ${lastOrder.notes}`;
                
      var url="https://wa.me/"+ph+"?text="+encodeURIComponent(msg);
      window.open(url,"_blank");
    }

    function requestEdit(){
       var ph="962"+WHATSAPP_NUMBER.substring(1);
       var msg="مرحباً، أرغب بتعديل طلبي السابق.\nرقم الطلب: ";
       window.open("https://wa.me/"+ph+"?text="+encodeURIComponent(msg),"_blank");
    }
    
    function callUs(){ window.open("tel:"+WHATSAPP_NUMBER,"_self"); }
    function enforceNumeric(e){ e.value=e.value.replace(/\D/g,"").slice(0,10); }
  </script>

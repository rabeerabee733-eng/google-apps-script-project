<script>
  const APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbzHUvvHCFiNjG-QyHocU5X-KKWt7dsNASGNO7ZOwIjoZAfZV2zpLHCy5CIXRT2rjfEK3A/exec";

  var lastOrder = null;

  function onSubmitClick() {
    var order = collectOrderData();
    lastOrder = order;

    fetch(APPS_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(order)
    })
    .then(res => res.json())
    .then(data => {
      fillConfirmScreen(data.orderNumber);
      showScreen("confirm");

      setTimeout(function () {
        openWhatsApp(data.orderNumber);
      }, 4000);
    })
    .catch(err => {
      alert("لم يتم إرسال الطلب!");
      fillConfirmScreen("غير متوفر");
      showScreen("confirm");
    });
  }

  function openWhatsApp(orderNumber) {
    var phone = "962798382004";
    var message = "تم استلام طلبي رقم: " + orderNumber;
    window.location.href =
      "https://api.whatsapp.com/send?phone=" + phone +
      "&text=" + encodeURIComponent(message);
  }
</script>

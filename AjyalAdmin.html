<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>إدارة خدمة أجيال</title><style>
body{font-family:Tajawal,Arial;background:#f4f7fb;color:#08284d;margin:20px}main{max-width:1150px;margin:auto}input,select,button,textarea{font:inherit;padding:10px;border:1px solid #ccd5df;border-radius:8px}button{cursor:pointer;background:#08284d;color:white}section{background:white;border-radius:14px;padding:18px;margin:16px 0}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.table{overflow:auto}table{width:100%;border-collapse:collapse}td,th{padding:12px;text-align:right;border-bottom:1px solid #ddd}dialog{width:min(90%,520px);border:0;border-radius:16px}label{display:block;margin:12px 0}label input,label textarea{width:90%}a{color:#087443}#message{min-height:24px}
</style></head><body><main><h1>إدارة خدمة أجيال</h1><p>الأولوية حسب رقم الحجز دون تحديد مواعيد. بيانات المعلمين محفوظة كسجلات عملاء مستقلة.</p><section><div class="toolbar"><input id="query" placeholder="اسم المعلم، الحساب، الهاتف أو رقم الحجز" aria-label="بحث"><select id="status" aria-label="الحالة"><option value="">جميع الحالات</option></select><button id="search">بحث وتحديث</button></div><p id="message" role="status"></p><div class="table"><table><thead><tr><th>رقم الحجز</th><th>المعلم</th><th>حساب أجيال</th><th>الهاتف</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody id="rows"></tbody></table></div><div class="toolbar"><button id="previous">السابق</button><span id="count"></span><button id="next">التالي</button></div></section></main>
<dialog id="editor"><form id="edit-form"><h2>بيانات العميل</h2><label>اسم المعلم<input id="edit-name" required maxlength="100"></label><label>حساب أجيال<input id="edit-account" required maxlength="150" dir="auto"></label><label>الحالة<select id="edit-status"></select></label><label>ملاحظات<textarea id="edit-notes" maxlength="1000"></textarea></label><button id="save">حفظ</button> <button type="button" id="close">إغلاق</button></form></dialog>
<script>
var offset=0,selected=null,busy=false;
var $=id=>document.getElementById(id);
function message(text){$('message').textContent=text;}
function setBusy(value){busy=value;['search','previous','next','save'].forEach(id=>$(id).disabled=value);}
function load(){if(busy)return;setBusy(true);google.script.run.withSuccessHandler(render).withFailureHandler(fail).ajyalAdminList({query:$('query').value,status:$('status').value,offset:offset});}
function fail(error){setBusy(false);message(error.message||String(error));}
function whatsappMessage(row){return 'مرحبًا أستاذ/أستاذة '+row.teacherName+'،\nبخصوص خدمة تنزيل الخطط على أجيال، رقم الحجز: '+row.orderNumber+'\nاسم المعلم: '+row.teacherName+'\nحساب أجيال: '+row.account+'\nهل بإمكانك تزويدنا برمز التحقق لحساب أجيال لإكمال تنزيل الخطط؟';}
function whatsappUrl(row){var phone=String(row.phone).replace(/\D/g,'');if(/^07\d{8}$/.test(phone))phone='962'+phone.slice(1);if(!/^9627\d{8}$/.test(phone))return '';return 'https://wa.me/'+phone+'?text='+encodeURIComponent(whatsappMessage(row));}
function render(data){setBusy(false);message('');if($('status').options.length===1)data.statuses.forEach(s=>{var o=new Option(s,s);$('status').add(o);$('edit-status').add(new Option(s,s));});$('rows').replaceChildren();data.rows.forEach(row=>{var tr=document.createElement('tr');[row.orderNumber,row.teacherName,row.account,row.phone,row.status].forEach(v=>{var td=document.createElement('td');td.textContent=v;tr.append(td);});var td=document.createElement('td');var edit=document.createElement('button');edit.textContent='تعديل';edit.onclick=()=>openEditor(row);td.append(edit,document.createTextNode(' '));var url=whatsappUrl(row);if(url){var a=document.createElement('a');a.textContent='فتح واتساب';a.href=url;a.target='_blank';a.rel='noopener noreferrer';td.append(a);}tr.append(td);$('rows').append(tr);});$('count').textContent=data.total?'عرض '+(offset+1)+'–'+Math.min(offset+100,data.total)+' من '+data.total:'لا توجد طلبات';$('previous').disabled=offset===0;$('next').disabled=offset+100>=data.total;}
function openEditor(row){selected=row;$('edit-name').value=row.teacherName;$('edit-account').value=row.account;$('edit-status').value=row.status;$('edit-notes').value=row.notes;$('editor').showModal();}
$('edit-form').onsubmit=function(e){e.preventDefault();if(busy)return;setBusy(true);google.script.run.withSuccessHandler(()=>{setBusy(false);$('editor').close();load();}).withFailureHandler(fail).ajyalAdminUpdate({requestId:selected.requestId,updatedAt:selected.updatedAt,teacherName:$('edit-name').value,account:$('edit-account').value,status:$('edit-status').value,notes:$('edit-notes').value});};
$('close').onclick=()=>$('editor').close();$('search').onclick=()=>{offset=0;load();};$('previous').onclick=()=>{offset=Math.max(0,offset-100);load();};$('next').onclick=()=>{offset+=100;load();};load();
</script></body></html>

<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>إدارة خدمة أجيال</title><style>body{font-family:Tajawal,Arial;background:#f4f7fb;color:#08284d;margin:20px}main{max-width:1150px;margin:auto}input,select,button,textarea{font:inherit;padding:10px;border:1px solid #ccd5df;border-radius:8px}button{cursor:pointer;background:#08284d;color:white}section{background:white;border-radius:14px;padding:18px;margin:16px 0}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.table{overflow:auto}table{width:100%;border-collapse:collapse}td,th{padding:12px;text-align:right;border-bottom:1px solid #ddd}dialog{width:min(90%,520px);border:0;border-radius:16px}label{display:block;margin:12px 0}label input,label textarea{width:90%}a{color:#087443}#message{min-height:24px}tr[data-status="جديد"]{background:#eaf3ff}tr[data-status="تم التواصل"]{background:#f1eaff}tr[data-status="بانتظار بيانات الحساب"]{background:#fff8ce}tr[data-status="قيد التنفيذ"]{background:#fff0df}tr[data-status="مكتمل"]{background:#dff4e4}tr[data-status="ملغي"]{background:#eceff2}tbody td{color:#172b3a}tbody tr:hover{filter:brightness(.97)}.status-legend{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.status-legend span{padding:7px 12px;border-radius:8px;font-size:14px}</style></head><body><main><h1>إدارة خدمة أجيال</h1><p>الأولوية حسب رقم الحجز دون تحديد مواعيد. بيانات المعلمين محفوظة كسجلات عملاء مستقلة.</p><section><div class="toolbar"><input id="query" placeholder="اسم المعلم، الصف، الهاتف أو رقم الحجز" aria-label="بحث"><select id="status" aria-label="الحالة"><option value="">جميع الحالات</option></select><select id="employee" aria-label="الموظف المنجز"><option value="">جميع الموظفين</option></select><button id="search">بحث وتحديث</button></div><div id="employee-counts" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px" aria-label="إجمالي إنجاز الموظفين"></div><p id="message" role="status"></p><div class="status-legend" aria-label="دليل ألوان الحالات"><span style="background:#eaf3ff">جديد</span><span style="background:#f1eaff">تم التواصل</span><span style="background:#fff8ce">بانتظار بيانات الحساب</span><span style="background:#fff0df">قيد التنفيذ</span><span style="background:#dff4e4">مكتمل</span><span style="background:#eceff2">ملغي</span></div><div class="table"><table><thead><tr><th>رقم الحجز</th><th>المعلم</th><th>الصف</th><th>الهاتف</th><th>الحالة</th><th>أنجز الطلب</th><th>إجراءات</th></tr></thead><tbody id="rows"></tbody></table></div><div class="toolbar"><button id="previous">السابق</button><span id="count"></span><button id="next">التالي</button></div></section></main><dialog id="editor"><form id="edit-form"><h2>بيانات العميل</h2><label>اسم المعلم<input id="edit-name" required maxlength="100"></label><label>الصف<select id="edit-grade" required><option value="">اختر الصف</option><option>صف أول</option><option>صف ثاني</option><option>صف ثالث</option></select></label><label>رقم واتساب للمعلم/المعلمة<input id="edit-phone" type="tel" required maxlength="20" dir="ltr"></label><label>الحالة<select id="edit-status" onchange="toggleEmployeeField()"></select></label><label id="employee-field" style="display:none">الموظف الذي أنجز الطلب<select id="edit-employee"><option value="">اختر الموظف</option></select></label><label>ملاحظات<textarea id="edit-notes" maxlength="1000"></textarea></label><button id="save">حفظ</button> <button type="button" id="close">إغلاق</button></form></dialog><script>
var offset=0,selected=null,busy=false;var $=id=>document.getElementById(id);
function message(text){$('message').textContent=text;}
function setBusy(value){busy=value;['search','previous','next','save'].forEach(id=>$(id).disabled=value);}
function load(){if(busy)return;setBusy(true);google.script.run.withSuccessHandler(render).withFailureHandler(fail).ajyalAdminList({query:$('query').value,status:$('status').value,employee:$('employee').value,offset:offset});}
function fail(error){setBusy(false);message(error.message||String(error));}
function whatsappMessage(row){return 'مرحبًا أستاذ/أستاذة '+row.teacherName+'،\nرقم الحجز: '+row.orderNumber+' — '+(row.grade||'')+'\nيرجى تزويدنا بحساب أجيال وكلمة السر لإضافة الخطط وتحليل المحتوى إلى منصة أجيال الخاصة بكم، وسيصلكم رمز تأكيد يرجى تزويدنا به.';}
function whatsappUrl(row){var phone=String(row.phone).replace(/\D/g,'');if(/^07\d{8}$/.test(phone))phone='962'+phone.slice(1);if(!/^9627\d{8}$/.test(phone))return '';return 'https://wa.me/'+phone+'?text='+encodeURIComponent(whatsappMessage(row));}
function render(data){setBusy(false);message('');if($('employee').options.length===1)(data.employees||[]).forEach(name=>$('employee').add(new Option(name,name)));$('employee-counts').replaceChildren();(data.employees||[]).forEach(name=>{var badge=document.createElement('span');badge.textContent=name+': '+((data.employeeCounts||{})[name]||0)+' مكتمل';badge.style.cssText='background:#f4f7fb;padding:10px;border-radius:8px';$('employee-counts').append(badge);});if($('edit-employee').options.length===1)(data.employees||[]).forEach(name=>$('edit-employee').add(new Option(name,name)));if($('status').options.length===1)data.statuses.forEach(s=>{$('status').add(new Option(s,s));$('edit-status').add(new Option(s,s));});$('rows').replaceChildren();data.rows.forEach(row=>{var tr=document.createElement('tr');tr.dataset.status=row.status;[row.orderNumber,row.teacherName,row.grade||'غير محدد',row.phone,row.status,row.status==='مكتمل'?(row.completedBy||'غير محدد'):'—'].forEach(v=>{var td=document.createElement('td');td.textContent=v;tr.append(td);});var td=document.createElement('td'),edit=document.createElement('button');edit.textContent='تعديل';edit.onclick=()=>openEditor(row);td.append(edit,document.createTextNode(' '));var copy=document.createElement('button');copy.type='button';copy.textContent='نسخ بيانات الطلب';copy.onclick=()=>copyOrder(row);td.append(copy,document.createTextNode(' '));var url=whatsappUrl(row);if(url){var a=document.createElement('a');a.textContent='💬 واتساب';a.setAttribute('aria-label','إرسال رسالة واتساب إلى '+row.teacherName);a.title='فتح رسالة واتساب';a.href=url;a.target='_blank';a.rel='noopener noreferrer';td.append(a);}tr.append(td);$('rows').append(tr);});$('count').textContent=data.total?'عرض '+(offset+1)+'–'+Math.min(offset+100,data.total)+' من '+data.total:'لا توجد طلبات';$('previous').disabled=offset===0;$('next').disabled=offset+100>=data.total;}
async function copyOrder(row){var text=['رقم الحجز: '+row.orderNumber,'المعلم: '+row.teacherName,'الصف: '+row.grade,'الهاتف: '+row.phone,'الحالة: '+row.status,'أنجز الطلب: '+(row.completedBy||'غير محدد'),'ملاحظات: '+(row.notes||'')].join('\n');try{await navigator.clipboard.writeText(text);message('تم نسخ بيانات الطلب');}catch(e){var area=document.createElement('textarea');area.value=text;document.body.append(area);area.select();var copied=document.execCommand('copy');area.remove();message(copied?'تم نسخ بيانات الطلب':'تعذر النسخ، حاول من متصفح آخر.');}}
function openEditor(row){selected=row;$('edit-name').value=row.teacherName;$('edit-grade').value=row.grade||'';$('edit-phone').value=row.phone;$('edit-status').value=row.status;$('edit-notes').value=row.notes;$('edit-employee').value=row.completedBy||'';toggleEmployeeField();$('editor').showModal();}
function toggleEmployeeField(){var done=$('edit-status').value==='مكتمل';$('employee-field').style.display=done?'block':'none';$('edit-employee').required=done;$('edit-employee').disabled=!done;}
$('edit-form').onsubmit=function(e){e.preventDefault();if(busy)return;setBusy(true);google.script.run.withSuccessHandler(()=>{setBusy(false);$('editor').close();load();}).withFailureHandler(fail).ajyalAdminUpdate({requestId:selected.requestId,updatedAt:selected.updatedAt,teacherName:$('edit-name').value,grade:$('edit-grade').value,phone:$('edit-phone').value,status:$('edit-status').value,completedBy:$('edit-employee').value,notes:$('edit-notes').value});};$('close').onclick=()=>$('editor').close();$('search').onclick=()=>{offset=0;load();};$('employee').onchange=()=>{offset=0;load();};$('status').onchange=()=>{offset=0;load();};$('previous').onclick=()=>{offset=Math.max(0,offset-100);load();};$('next').onclick=()=>{offset+=100;load();};load();
</script></body></html>

<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#101010;color:#f6f6f6;font-family:Tahoma,Arial,sans-serif;line-height:1.8}.shell{max-width:650px;margin:36px auto;padding:18px}.brand{color:#e1bb4b;font-size:16px}.card{background:#1c1c1c;border:1px solid #514522;border-radius:18px;padding:24px;margin:20px 0}h1{font-size:28px}label{display:block;margin:14px 0}input,button,a{font:inherit}input{width:100%;padding:13px;border:1px solid #555;border-radius:10px;background:#0d0d0d;color:#fff;font-size:18px}button,.contact{display:inline-block;border:0;border-radius:10px;padding:13px 20px;background:#d4af37;color:#111;text-decoration:none;font-weight:bold}button{width:100%;cursor:pointer}button:disabled{opacity:.6}.status{font-size:24px;color:#a8e9c1}.steps{padding:0;list-style:none;display:grid;gap:10px}.steps li{padding:10px 14px;border-right:4px solid #555;background:#262626}.steps .done{border-color:#5cba87;color:#b4f1cd}.message{white-space:pre-wrap}.muted{color:#c5c5c5;font-size:14px}@media(max-width:600px){.shell{margin:8px auto;padding:12px}.card{padding:18px}h1{font-size:25px}}</style></head><body><main class="shell"><p class="brand">التحضير الإلكتروني للخدمات المطبعية</p><h1>متابعة حالة حجزك</h1><p>أدخل رقم الطلب ورقم الهاتف الأساسي الذي استخدمته عند الحجز.</p><form id="tracking-form" class="card"><label>رقم الطلب<input id="tracking-number" inputmode="numeric" required maxlength="9" autocomplete="off"></label><label>رقم الهاتف المسجل<input id="tracking-phone" type="tel" inputmode="tel" required maxlength="20" autocomplete="tel" dir="ltr" placeholder="07XXXXXXXX"></label><button id="tracking-submit">عرض حالة الحجز</button></form><p id="tracking-message" class="message" role="status" aria-live="polite"></p><section id="tracking-result" class="card" hidden><h2 id="tracking-title"></h2><p id="tracking-status" class="status"></p><ol id="tracking-steps" class="steps"></ol><p id="tracking-updated" class="muted"></p><p id="tracking-ajyal"></p><p class="muted">الحالة تُحدّث عند تسجيل التجهيز أو التسليم. تصدير الستكر وحده لا يعني تسليم الطرد للمندوب.</p></section><a class="contact" href="https://wa.me/962798382004" target="_blank" rel="noopener">تواصل معنا عبر واتساب</a></main><script>
(()=>{const $=id=>document.getElementById(id);$('tracking-form').onsubmit=e=>{e.preventDefault();if($('tracking-submit').disabled)return;$('tracking-submit').disabled=true;$('tracking-result').hidden=true;$('tracking-message').textContent='جارٍ التحقق من بيانات الحجز...';google.script.run.withSuccessHandler(data=>{$('tracking-submit').disabled=false;$('tracking-message').textContent='';$('tracking-title').textContent='الطلب رقم '+data.orderNumber;$('tracking-status').textContent=data.status;$('tracking-updated').textContent='آخر تحديث: '+(data.updatedAt||'لم يسجل تحديث بعد');const steps=['جديد','قيد التجهيز','جاهز','خرج للتوصيل','تم التسليم'],index=steps.indexOf(data.status);$('tracking-steps').replaceChildren();steps.forEach((name,i)=>{const li=document.createElement('li');li.textContent=name;if(index>=i)li.className='done';$('tracking-steps').append(li);});$('tracking-ajyal').textContent=data.ajyal.total?'خدمة أجيال: اكتمل '+data.ajyal.completed+' من '+data.ajyal.total+' اشتراك.':'';$('tracking-result').hidden=false;}).withFailureHandler(error=>{$('tracking-submit').disabled=false;$('tracking-message').textContent=error.message||'تعذر تحميل الحالة. حاول مجددًا.';}).customerOrderTracking({orderNumber:$('tracking-number').value,phone:$('tracking-phone').value});};})();
</script></body></html>
